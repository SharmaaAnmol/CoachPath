<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>CoachPath · Offline</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100dvh; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(60% 40% at 50% 0%, #2a1650 0%, #000 70%) #000;
    color: #F4F2FA; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 360px; text-align: center; display: grid; gap: 16px; justify-items: center; }
  img { width: 56px; height: 56px; border-radius: 14px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  p { color: #A8A3B8; font-size: 15px; }
  button {
    margin-top: 8px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px;
    background: #C4B5FD; color: #140A26; font: 600 15px system-ui, sans-serif; cursor: pointer;
  }
  button:active { transform: scale(0.98); }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>CoachPath needs a connection to load your roadmap, jobs and resumes. Your saved work is safe on our servers.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
