services:
  - type: web
    name: coachpath-api-staging
    env: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "sh scripts/start.sh"
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: API_HOST
        value: 0.0.0.0
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: COOKIE_SAMESITE
        value: lax
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: AI_REQUEST_TIMEOUT
        value: "60"
      # Set to "r2" in the Render dashboard once the S3_* values below are filled in.
      # "local" keeps resumes on the instance disk, which is wiped on every deploy.
      - key: STORAGE_PROVIDER
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: AI_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: AI_RATE_LIMIT_PER_DAY
        value: "150"
      - key: UPLOAD_DIR
        value: uploads
      - key: JOB_INGESTION_ENABLED
        value: "true"
      - key: JOB_API_PROVIDER
        value: seed
